<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sargam</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="audio" preload="metadata"></audio>
<div class="lights" id="lights"></div>
<h1 class="logo">SARGAM<small>side A &middot; 1997 &middot; hi-fi</small></h1>
<main id="wall"></main>

<footer class="deck" id="deck">
  <div class="spk"></div>
  <div class="mid">
    <div class="tape">
      <i class="reel"></i>
      <div class="disp"><b id="title">SARGAM</b><span id="artist">tap a poster</span></div>
      <i class="reel"></i>
    </div>
    <div class="row"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    <div class="btns">
      <button id="shuf" title="Shuffle">SHUF</button>
      <button id="prev" aria-label="Previous">&#9664;&#9664;</button>
      <button id="play" class="big" aria-label="Play">&#9654;</button>
      <button id="next" aria-label="Next">&#9654;&#9654;</button>
      <button id="lamp" title="Lights">LAMP</button>
    </div>
  </div>
  <div class="spk"></div>
</footer>
<script src="script.js"></script>
</body>
</html>
