<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<title>Sargam</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sargam">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body data-cat="Bollywood">
<audio id="audio" preload="metadata"></audio>

<div class="bgs">
  <div class="bg" data-c="Bollywood"></div>
  <div class="bg" data-c="Punjabi"></div>
  <div class="bg" data-c="English"></div>
</div>
<div class="shade"></div>
<canvas id="rain"></canvas>
<div class="sky" id="sky">
  <div class="cloud" style="--t:5vh;--w:58vw;--d:75s;--dl:-22s"></div>
  <div class="cloud" style="--t:17vh;--w:44vw;--d:55s;--dl:-40s"></div>
  <div class="cloud" style="--t:28vh;--w:66vw;--d:95s;--dl:-8s"></div>
  <div class="cloud" style="--t:11vh;--w:36vw;--d:48s;--dl:-30s"></div>
</div>
<canvas id="leaves"></canvas>

<main class="stage">
  <h1 class="title"><span class="hi">SARGAM</span><span class="en">💽</span></h1>

  <button class="rainbtn" id="rainBtn" aria-pressed="false">
    <span>&#127783;</span> Rain Mood <em id="rainState">OFF</em>
  </button>

  <section class="player" id="player">
    <div class="art" id="art"></div>
    <div class="meta" id="meta" role="button" tabindex="0" aria-label="Open song list">
      <b id="title">Sargam</b>
      <span id="sub">tap to choose a song</span>
      <div class="bar"><i id="cur">0:00</i><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><i id="dur">0:00</i></div>
    </div>
    <div class="ctl">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button id="play" class="pl" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </section>
</main>

<div class="backdrop" id="bd"></div>
<aside class="sheet" id="sheet" aria-label="Song list">
  <div class="grab" id="grab"></div>
  <div id="list"></div>
</aside>

<script src="script.js"></script>
</body>
</html>
